<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PantryAI — Turn Ingredients Into Recipe Ideas</title>
    <meta name="description" content="PantryAI turns the ingredients you already have into realistic recipe ideas using Gemini AI, including missing grocery items and nutrition estimates." />
    <meta property="og:title" content="PantryAI — Turn Ingredients Into Recipe Ideas" />
    <meta property="og:description" content="Tell PantryAI the ingredients you have, and get 3 tailored recipes with step-by-step instructions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pantryai_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased bg-[var(--bg)] text-[var(--text)] transition-colors duration-200 selection:bg-[var(--soft-highlight)] selection:text-[var(--soft-highlight-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
